name: Usable regression

on:
  pull_request:
  push:
    branches: ['main', 'flow/devflower-usable-v1', 'flow/template-governance-ci', 'flow/agent-workspace-vnext']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Environment and immutable source receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          node --version
          git --version
          mkdir -p "$RUNNER_TEMP/usable-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/usable-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/usable-evidence/tree.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/usable-evidence/source.tar.gz"
      - name: Install isolation runtime on this disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Test actual namespaces instead of silently skipping unsupported isolation.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pinned native CLI test fixtures outside source
        shell: bash
        run: |
          set -euo pipefail
          for kind in supported legacy; do
            mkdir -p "$RUNNER_TEMP/native-fixtures/$kind"
            cp "tests/ci_native/$kind/package.json" "tests/ci_native/$kind/package-lock.json" "$RUNNER_TEMP/native-fixtures/$kind/"
            npm ci --prefix "$RUNNER_TEMP/native-fixtures/$kind" --ignore-scripts --no-audit --no-fund
          done
          python3 -B tests/ci_native/resolve.py "$RUNNER_TEMP/native-fixtures" "$GITHUB_ENV" "$RUNNER_TEMP/usable-evidence/native-cli-identity.json"
      - name: All Python contracts including Usable and orchestration
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/usable-evidence/unittest.log"
      - name: Rebuild the workbench from pinned external dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workbench-ui"
          cp tools/studio/workbench_ui/package.json tools/studio/workbench_ui/package-lock.json "$RUNNER_TEMP/workbench-ui/"
          npm ci --prefix "$RUNNER_TEMP/workbench-ui" --ignore-scripts --no-audit --no-fund
          DEVFLOWER_UI_DEPS="$RUNNER_TEMP/workbench-ui" node tools/studio/workbench_ui/build.mjs
          git diff --exit-code -- tools/studio/static/workbench.js tools/studio/static/workbench.css tools/studio/workbench_ui/THIRD_PARTY_LICENSES.txt
      - name: Baseline and all frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devflower.py check --baseline
          node --check tools/studio/static/app.js
          node --check tools/studio/static/workspace.js
          node --check tools/studio/static/usable.js
          node --check tools/studio/static/usable_canvas.js
          node --check tools/studio/static/usable_sessions.js
          node --check tests/session_browser.cjs
          node --check tests/workbench_browser.cjs
          node --check tests/workbench_stable_browser.cjs
          node --input-type=module --check < tools/studio/static/workbench.js
      - name: Canvas editing rules
        shell: bash
        run: |
          set -euo pipefail
          DEVFLOWER_UI_DEPS="$RUNNER_TEMP/workbench-ui" node --test tests/*.test.mjs tests/*.test.cjs 2>&1 | tee "$RUNNER_TEMP/usable-evidence/editor.log"
      - name: Real host isolation probes
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/host_isolation.py 2>&1 | tee "$RUNNER_TEMP/usable-evidence/isolation.log"
      - name: Preserve source identity and actual test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usable-contract-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/usable-evidence/
          retention-days: 7
          if-no-files-found: error

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create public browser evidence directory in the container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-browser-evidence"
          printf 'PUBLIC_BROWSER_EVIDENCE=%s\n' "$RUNNER_TEMP/public-browser-evidence" >> "$GITHUB_ENV"
      - name: Install pinned browser test driver outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          node --version
          git --version
          npm install --prefix "$RUNNER_TEMP/pw" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          echo "PLAYWRIGHT_PACKAGE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$GITHUB_WORKSPACE/tests/browser_driver.cjs" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node -e "process.stdout.write(require('$RUNNER_TEMP/pw/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          test -x "$(node -e "process.stdout.write(require('$RUNNER_TEMP/pw/node_modules/playwright').chromium.executablePath())")"
      - name: Real HTTP and Chromium regression (no models or user credentials)
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for suite in studio_races studio_identity_races workspace_browser usable_browser template_browser session_browser workbench_browser workbench_stable_browser project_files_browser; do
            if python3 "tests/$suite.py" --chromium "$CHROMIUM" --node node --playwright-module "$PLAYWRIGHT_MODULE" --artifacts "$RUNNER_TEMP/$suite"; then
              :
            else
              code=$?
              if [ "$status" -eq 0 ]; then status=$code; fi
            fi
          done
          exit "$status"
      - name: Collect public browser results and screenshots
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for suite in studio_races studio_identity_races workspace_browser usable_browser template_browser session_browser workbench_browser workbench_stable_browser project_files_browser; do
            mkdir -p "$PUBLIC_BROWSER_EVIDENCE/$suite"
            for file in "$RUNNER_TEMP/$suite/"*results.json "$RUNNER_TEMP/$suite/"*.png; do
              if [[ -f "$file" && ! -L "$file" ]]; then
                cp -- "$file" "$PUBLIC_BROWSER_EVIDENCE/$suite/"
              fi
            done
          done
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usable-browser-evidence-${{ github.run_id }}
          # This path is emitted from the container's actual RUNNER_TEMP.
          path: ${{ env.PUBLIC_BROWSER_EVIDENCE }}/
          retention-days: 7
          if-no-files-found: error
